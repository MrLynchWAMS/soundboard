<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Soundboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111827;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    h1 { font-size: 1.5rem; font-weight: 700; color: #f43f5e; display: flex; align-items: center; gap: 0.5rem; }

    .header-controls { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }

    input, select, button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.5rem 0.85rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--accent); }

    button {
      background-color: var(--accent);
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    button:hover { background-color: var(--accent-hover); }
    button.secondary { background-color: var(--card-bg); border: 1px solid var(--border); }
    button.secondary:hover { background-color: #334155; }
    button.danger { background-color: var(--danger); }

    .container { padding: 1.5rem 2rem; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; }

    /* Tag Bar */
    .tag-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: center; }
    .tag-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.3rem 0.75rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
    }
    .tag-pill.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* Sound Grid */
    .sound-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1.25rem;
    }

    /* Sound Card */
    .sound-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: grab;
    }

    .sound-card:active { cursor: grabbing; }
    .sound-card.dragging { opacity: 0.4; border: 2px dashed var(--accent); }
    .sound-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.3); }

    /* Sound Button */
    .btn-trigger {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3), 0 4px 10px rgba(0,0,0,0.3);
      position: relative;
      margin-bottom: 0.75rem;
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }

    .btn-trigger:active {
      transform: translateY(2px);
      box-shadow: inset 0 -1px 0 rgba(0,0,0,0.3), 0 2px 5px rgba(0,0,0,0.3);
    }

    .btn-trigger.playing {
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0px rgba(99, 102, 241, 0.7); }
      100% { box-shadow: 0 0 0 12px rgba(99, 102, 241, 0); }
    }

    .sound-title {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .card-tags {
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .mini-tag {
      font-size: 0.65rem;
      background: rgba(255,255,255,0.06);
      padding: 0.1rem 0.4rem;
      border-radius: 0.25rem;
      color: var(--text-muted);
    }

    .card-actions {
      position: absolute;
      top: 0.4rem;
      right: 0.4rem;
      display: none;
      gap: 0.2rem;
    }

    .sound-card:hover .card-actions { display: flex; }

    .btn-icon {
      background: rgba(15, 23, 42, 0.8);
      border: none;
      color: var(--text-muted);
      width: 22px;
      height: 22px;
      border-radius: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      padding: 0;
    }

    .btn-icon:hover { color: white; background: var(--border); }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 0.75rem;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal h2 { font-size: 1.2rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-group label { font-size: 0.8rem; color: var(--text-muted); }

    textarea {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.5rem;
      border-radius: 0.5rem;
      height: 120px;
      resize: vertical;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔊 Instant Board</h1>
    <div class="header-controls">
      <input type="text" id="searchInput" placeholder="Search sounds or tags...">
      <select id="sortSelect">
        <option value="manual">Sort: Manual (Drag & Drop)</option>
        <option value="az">Sort: Alphabetical (A-Z)</option>
        <option value="za">Sort: Alphabetical (Z-A)</option>
        <option value="newest">Sort: Date Added</option>
      </select>
      <button onclick="stopAllSounds()" class="secondary">⏹️ Stop All</button>
      <button onclick="openModal('addModal')">+ Add Sound</button>
      <button onclick="openModal('importModal')" class="secondary">📥 Import HTML</button>
      <button onclick="exportJSON()" class="secondary">💾 Export JSON</button>
    </div>
  </header>

  <div class="container">
    <div class="tag-bar" id="tagBar"></div>
    <div class="sound-grid" id="soundGrid"></div>
  </div>

  <!-- Add Sound Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h2>Add New Sound</h2>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="addTitle" placeholder="e.g. Air Horn">
      </div>
      <div class="form-group">
        <label>Sound Link / Direct MP3 URL</label>
        <input type="text" id="addUrl" placeholder="https://www.myinstants.com/media/sounds/... or local file path">
      </div>
      <div class="form-group">
        <label>Tags (comma separated)</label>
        <input type="text" id="addTags" placeholder="e.g. Meme, Horn, Loud">
      </div>
      <div class="form-group">
        <label>Button Color</label>
        <input type="color" id="addColor" value="#ef4444" style="height:40px; padding:2px; cursor:pointer;">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
        <button onclick="closeModal('addModal')" class="secondary">Cancel</button>
        <button onclick="saveNewSound()">Add Sound</button>
      </div>
    </div>
  </div>

  <!-- Import HTML Modal -->
  <div class="modal-overlay" id="importModal">
    <div class="modal">
      <h2>Import Myinstants Favorites</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted);">
        Paste the HTML code from your saved Myinstants Favorites page below, or drop the content:
      </p>
      <textarea id="importHtmlText" placeholder="Paste Myinstants HTML code here..."></textarea>
      <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
        <button onclick="closeModal('importModal')" class="secondary">Cancel</button>
        <button onclick="processHTMLImport()">Import Sounds</button>
      </div>
    </div>
  </div>

      { id: "78", title: "Silencio bruno", url: "https://www.myinstants.com/media/sounds/silencio-bruno.mp3", tags: ["Imported"], color: "#00FF00", dateAdded: 78 },
      { id: "79", title: "Silêncio!", url: "https://www.myinstants.com/media/sounds/silencio.mp3", tags: ["Imported"], color: "#FF0000", dateAdded: 79 },
      { id: "80", title: "snd - Time's Up -Jeopardy", url: "https://www.myinstants.com/media/sounds/snd-times-up-jeopardy.mp3", tags: ["Imported"], color: "#FF8A23", dateAdded: 80 },
      { id: "81", title: "Super Mario 64 here we go", url: "https://www.myinstants.com/media/sounds/super-mario-64-here-we-go.mp3", tags: ["Imported"], color: "#ff66ff", dateAdded: 81 },
      { id: "82", title: "Super Mario Bros. Underground", url: "https://www.myinstants.com/media/sounds/super-mario-bros-underground.mp3", tags: ["Imported"], color: "#ff00ff", dateAdded: 82 },
      { id: "83", title: "Super Mario Death", url: "https://www.myinstants.com/media/sounds/super-mario-death.mp3", tags: ["Imported"], color: "#FF0000", dateAdded: 83 },
      { id: "84", title: "suspense rising", url: "https://www.myinstants.com/media/sounds/suspense-rising.mp3", tags: ["Imported"], color: "#FF0000", dateAdded: 84 },
      { id: "85", title: "Taco Bell Bong", url: "https://www.myinstants.com/media/sounds/taco-bell-bong.mp3", tags: ["Imported"], color: "#FF0000", dateAdded: 85 },
      { id: "86", title: "that was easy button", url: "https://www.myinstants.com/media/sounds/that-was-easy-button.mp3", tags: ["Imported"], color: "#FF0000", dateAdded: 86 },
      { id: "87", title: "The Lion Sleeps Tonight (meme)", url: "https://www.myinstants.com/media/sounds/the-lion-sleeps-tonight-meme.mp3", tags: ["Imported"], color: "#FF0000", dateAdded: 87 },
      { id: "88", title: "The Voice Buzzer", url: "https://www.myinstants.com/media/sounds/the-voice-buzzer.mp3", tags: ["Imported"], color: "#FF0000", dateAdded: 88 },
      { id: "89", title: "Victory!", url: "https://www.myinstants.com/media/sounds/victory.mp3", tags: ["Imported"], color: "#66ffcc", dateAdded: 89 },
      { id: "90", title: "WampWamp", url: "https://www.myinstants.com/media/sounds/wampwamp.mp3", tags: ["Imported"], color: "#1017FF", dateAdded: 90 }
    ];

    let sounds = [];
    let selectedTag = "All";
    let activeAudio = {}; // track playing audio instances
    let draggedIndex = null;

    // Load State
    async function init() {
      const saved = localStorage.getItem("custom_soundboard_data");
      if (saved) {
        sounds = JSON.parse(saved);
      } else {
        // Try fetching sounds.json from repo root if published
        try {
          const res = await fetch("sounds.json");
          if (res.ok) {
            sounds = await res.json();
          } else {
            sounds = defaultFavorites;
          }
        } catch {
          sounds = defaultFavorites;
        }
      }
      render();
    }

    function saveState() {
      localStorage.setItem("custom_soundboard_data", JSON.stringify(sounds));
    }

    // Render Tag Bar & Sound Grid
    function render() {
      renderTags();
      renderGrid();
    }

    function renderTags() {
      const tagBar = document.getElementById("tagBar");
      const allTags = new Set(["All"]);
      sounds.forEach(s => (s.tags || []).forEach(t => allTags.add(t)));

      tagBar.innerHTML = "";
      allTags.forEach(tag => {
        const pill = document.createElement("div");
        pill.className = `tag-pill ${tag === selectedTag ? 'active' : ''}`;
        pill.innerText = tag;
        pill.onclick = () => { selectedTag = tag; render(); };
        tagBar.appendChild(pill);
      });
    }

    function renderGrid() {
      const grid = document.getElementById("soundGrid");
      const search = document.getElementById("searchInput").value.toLowerCase();
      const sort = document.getElementById("sortSelect").value;

      let filtered = sounds.filter(s => {
        const matchesTag = selectedTag === "All" || (s.tags && s.tags.includes(selectedTag));
        const matchesSearch = s.title.toLowerCase().includes(search) || 
                              (s.tags && s.tags.some(t => t.toLowerCase().includes(search)));
        return matchesTag && matchesSearch;
      });

      // Sorting Logic
      if (sort === "az") filtered.sort((a,b) => a.title.localeCompare(b.title));
      if (sort === "za") filtered.sort((a,b) => b.title.localeCompare(a.title));
      if (sort === "newest") filtered.sort((a,b) => b.dateAdded - a.dateAdded);

      grid.innerHTML = "";
      filtered.forEach((sound, index) => {
        const card = document.createElement("div");
        card.className = "sound-card";
        card.draggable = sort === "manual";
        
        // Drag events
        card.ondragstart = () => { draggedIndex = index; card.classList.add("dragging"); };
        card.ondragend = () => { card.classList.remove("dragging"); };
        card.ondragover = (e) => e.preventDefault();
        card.ondrop = () => handleDrop(index);

        card.innerHTML = `
          <div class="card-actions">
            <button class="btn-icon" onclick="deleteSound('${sound.id}')" title="Delete">✕</button>
          </div>
          <button class="btn-trigger" id="btn-${sound.id}" style="background-color: ${sound.color || '#6366f1'};" onclick="playSound('${sound.id}', '${sound.url}')"></button>
          <div class="sound-title">${sound.title}</div>
          <div class="card-tags">
            ${(sound.tags || []).map(t => `<span class="mini-tag">${t}</span>`).join('')}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Audio Playback
    function playSound(id, url) {
      const btn = document.getElementById(`btn-${id}`);

      if (activeAudio[id]) {
        activeAudio[id].pause();
        activeAudio[id].currentTime = 0;
        delete activeAudio[id];
        if (btn) btn.classList.remove("playing");
        return;
      }

      const audio = new Audio(url);
      activeAudio[id] = audio;
      if (btn) btn.classList.add("playing");

      audio.play().catch(e => {
        if (btn) btn.classList.remove("playing");
        delete activeAudio[id];
        fixBrokenSound(id);
      });

      audio.onended = () => {
        delete activeAudio[id];
        if (btn) btn.classList.remove("playing");
      };
    }

    // Called when a sound fails to play. Lets the user paste a corrected
    // URL right away instead of losing the sound or editing code.
    function fixBrokenSound(id) {
      const sound = sounds.find(s => s.id === id);
      if (!sound) return;
      const newUrl = prompt(
        `"${sound.title}" won't play (the link is likely dead or wrong).\n\n` +
        `Grab the real link: open the sound on myinstants.com, open DevTools > Network tab, ` +
        `click Play there, and copy the .mp3 request URL. Paste it below to fix this sound ` +
        `(or Cancel to leave it broken for now):`,
        sound.url
      );
      if (newUrl && newUrl.trim() && newUrl.trim() !== sound.url) {
        sound.url = newUrl.trim();
        saveState();
      }
    }

    function stopAllSounds() {
      Object.keys(activeAudio).forEach(id => {
        activeAudio[id].pause();
        const btn = document.getElementById(`btn-${id}`);
        if (btn) btn.classList.remove("playing");
      });
      activeAudio = {};
    }

    // Manual Drag and Drop Reordering
    function handleDrop(targetIndex) {
      if (draggedIndex === null || draggedIndex === targetIndex) return;
      const movedItem = sounds.splice(draggedIndex, 1)[0];
      sounds.splice(targetIndex, 0, movedItem);
      draggedIndex = null;
      saveState();
      render();
    }

    // Modal Control
    function openModal(id) { document.getElementById(id).style.display = "flex"; }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }

    // Add New Sound
    function saveNewSound() {
      const title = document.getElementById("addTitle").value.trim();
      let url = document.getElementById("addUrl").value.trim();
      const tags = document.getElementById("addTags").value.split(",").map(t => t.trim()).filter(Boolean);
      const color = document.getElementById("addColor").value;

      if (!title || !url) return alert("Title and URL are required.");

      // Convert Myinstants page link to MP3 URL if needed
      if (url.includes("myinstants.com/en/instant/")) {
        const slug = url.split("/instant/")[1].replace(/\/$/, "").replace(/-\d+$/, "");
        url = `https://www.myinstants.com/media/sounds/${slug}.mp3`;
      }

      sounds.push({
        id: "snd_" + Date.now(),
        title, url, tags, color,
        dateAdded: Date.now()
      });

      saveState();
      render();
      closeModal("addModal");
      document.getElementById("addTitle").value = "";
      document.getElementById("addUrl").value = "";
      document.getElementById("addTags").value = "";
    }

    function deleteSound(id) {
      if (!confirm("Remove this sound?")) return;
      sounds = sounds.filter(s => s.id !== id);
      saveState();
      render();
    }

    // Process Myinstants HTML Import
    function processHTMLImport() {
      const rawHtml = document.getElementById("importHtmlText").value;
      if (!rawHtml) return;

      const parser = new DOMParser();
      const doc = parser.parseFromString(rawHtml, "text/html");
      const links = doc.querySelectorAll("a.instant-link, a[href*='/instant/']");

      let addedCount = 0;
      links.forEach(link => {
        const title = link.textContent.trim();
        const href = link.getAttribute("href") || "";
        if (title && href) {
          const match = href.match(/\/instant\/([^\/]+)\/?/);
          if (match && match[1]) {
            const soundSlug = match[1].replace(/-\d+$/, "");
            const mp3Url = `https://www.myinstants.com/media/sounds/${soundSlug}.mp3`;
            
            // Avoid duplicate additions
            if (!sounds.some(s => s.title === title)) {
              sounds.push({
                id: "snd_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
                title: title,
                url: mp3Url,
                tags: ["Imported"],
                color: "#" + Math.floor(Math.random()*16777215).toString(16),
                dateAdded: Date.now()
              });
              addedCount++;
            }
          }
        }
      });

      saveState();
      render();
      closeModal("importModal");
      document.getElementById("importHtmlText").value = "";
      alert(`Successfully imported ${addedCount} sounds!`);
    }

    // Export JSON Configuration for GitHub Pages hosting
    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(sounds, null, 2));
      const dlAnchor = document.createElement("a");
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", "sounds.json");
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    }

    // Event Listeners
    document.getElementById("searchInput").addEventListener("input", renderGrid);
    document.getElementById("sortSelect").addEventListener("change", renderGrid);

    // Run Initializer
    init();
  </script>
</body>
